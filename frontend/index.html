<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OEI Orbital Passes</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <link rel="stylesheet" href="./static/css/style.css" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <div class="container">
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="header">
                <h1><i class="fas fa-satellite"></i> OEI</h1>
                <p>Orbital Edge Imaging</p>
            </div>
            
            <div class="controls">
                <div class="error-message" id="errorMessage"></div>
                <div class="success-message" id="successMessage"></div>
                
                <div class="form-group">
                    <label for="aoiFile">
                        <i class="fas fa-map-marked-alt"></i> Upload AOI (GeoJSON)
                    </label>
                    <div class="file-input-wrapper">
                        <input type="file" id="aoiFile" class="file-input" accept=".json,.geojson" />
                        <label for="aoiFile" class="file-input-label" id="aoiFileLabel">
                            <i class="fas fa-cloud-upload-alt"></i>
                            <span>Select GeoJSON file</span>
                        </label>
                    </div>
                </div>

                <div class="form-group">
                    <label for="satName">
                        <i class="fas fa-satellite-dish"></i> Satellite Name
                    </label>
                    <input
                        type="text"
                        id="satName"
                        class="input-field"
                        placeholder="e.g. Sentinel-1A"
                    />
                </div>

                <div class="form-group">
                    <label for="noradId">
                        <i class="fas fa-hashtag"></i> NORAD ID
                    </label>
                    <input
                        type="number"
                        id="noradId"
                        class="input-field"
                        placeholder="e.g. 39634"
                    />
                </div>

                <button id="runBtn" class="run-btn" disabled>
                    <i class="fas fa-play"></i>
                    <span>Run Prediction</span>
                </button>
            </div>
        </div>

        <!-- Map -->
        <div class="map-container">
            <div id="map"></div>
        </div>

        <!-- Passes Panel -->
        <div class="passes-panel">
            <div class="passes-header">
                <h2><i class="fas fa-route"></i> Orbital Passes</h2>
            </div>
            <div class="passes-list" id="passesList">
                <div class="empty-state">
                    <i class="fas fa-satellite"></i>
                    <p>Upload an AOI and run prediction to see orbital passes</p>
                </div>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script src="./src/app.js"></script>
</body>
</html>
