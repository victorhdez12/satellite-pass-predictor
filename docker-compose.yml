services:
  # PostgreSQL + PostGIS Database
  db:
    image: postgis/postgis:13-3.3
    environment:
      POSTGRES_USER: oei
      POSTGRES_PASSWORD: oei
      POSTGRES_DB: oei
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - oei_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oei -d oei"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Backend API
  web:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://oei:oei@db:5432/oei
      - SPACETRACK_USERNAME=victor.legazpi@gmail.com
      - SPACETRACK_PASSWORD=Palmeradechocolate127
    volumes:
      - ./backend/app:/code/app
    networks:
      - oei_network
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  postgres_data:

networks:
  oei_network:
    driver: bridge